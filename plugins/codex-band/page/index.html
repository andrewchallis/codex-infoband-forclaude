<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Codex Band Requests</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, summary strip on top, one row per Codex request, details fold open. */
:root {
  --bg: #f5f6f7; --panel: #ffffff; --fg: #1b1f24; --muted: #5d6670; --line: #dde1e5;
  --accent: #0f6b74;
  --run: #a35f00; --run-bg: #fff3dd; --ok: #1d7a3e; --ok-bg: #e4f4e9; --bad: #b3261e; --bad-bg: #fbe5e3; --idle: #5d6670; --idle-bg: #eceff2;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121518; --panel: #1a1e22; --fg: #e6e9ec; --muted: #9aa4ae; --line: #2c3238; --accent: #4fb8c2;
  --run: #f0b25a; --run-bg: #3a2a10; --ok: #6fcf8f; --ok-bg: #143221; --bad: #f08a82; --bad-bg: #3d1b18; --idle: #9aa4ae; --idle-bg: #252a30; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121518; --panel: #1a1e22; --fg: #e6e9ec; --muted: #9aa4ae; --line: #2c3238; --accent: #4fb8c2;
  --run: #f0b25a; --run-bg: #3a2a10; --ok: #6fcf8f; --ok-bg: #143221; --bad: #f08a82; --bad-bg: #3d1b18; --idle: #9aa4ae; --idle-bg: #252a30; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { position: relative; padding-right: 44px; }
.cog { position: absolute; top: 0; right: 0; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; }
.cog:hover { color: var(--fg); }
.cog:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cog svg { width: 18px; height: 18px; }
dialog.settings { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); padding: 18px; width: min(380px, calc(100vw - 32px)); }
dialog.settings::backdrop { background: rgb(0 0 0 / .35); }
dialog.settings h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
.field { display: grid; gap: 4px; margin: 0 0 14px; font-size: 14px; }
.field input[type=number] { width: 90px; font: 14px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.field input:disabled { opacity: .5; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 0 0 8px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.actions button { font: 500 14px var(--sans); border-radius: 6px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.error { color: var(--bad); font-size: 13px; margin: 8px 0 0; }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--idle-bg); color: var(--idle); font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; }
.chip.run { background: var(--run-bg); color: var(--run); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.list { display: grid; gap: 10px; }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; justify-self: start; }
.views button { font: 500 13px var(--sans); color: var(--muted); background: var(--panel); border: 0; padding: 6px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.views button + button { border-left: 1px solid var(--line); }
.views button[aria-pressed="true"] { background: var(--idle-bg); color: var(--fg); }
.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
details.req { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
details.req > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; }
details.req > summary::-webkit-details-marker { display: none; }
details.req > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.kind { font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ttl { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.body { padding: 0 14px 14px; display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 4px; }
.brief { font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 6px; padding: 10px 12px; margin: 0; max-height: 260px; overflow: auto; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
td.p { font: 500 12px var(--mono); white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; }
a { color: var(--accent); }
.empty, .note { color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 16px; }
.note { border-style: solid; font-size: 14px; }
code { font: 13px var(--mono); }
@media (max-width: 480px) { details.req > summary { grid-template-columns: 1fr auto; } .kind { grid-column: 1 / 3; } .meta { grid-column: 1 / 3; } }
@media (prefers-reduced-motion: no-preference) { details.req[open] .body { animation: fade .15s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>

<div class="wrap">
  <header>
    <h1>Codex requests</h1>
    <button type="button" class="cog" id="cog" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <p class="sub">Every review or task a Claude thread sends to Codex: what was sent, where it is now, what Codex found and what was done about it.</p>
  </header>
  <div class="strip" id="strip" aria-live="polite"></div>
  <div class="views" id="views" role="group" aria-label="Show requests">
    <button type="button" data-view="active" aria-pressed="true">Active</button>
    <button type="button" data-view="archived" aria-pressed="false">Archived</button>
    <button type="button" data-view="all" aria-pressed="false">All</button>
  </div>
  <div class="note" id="status" hidden></div>
  <dialog class="settings" id="settings" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form">
      <h2 id="settings-title">Settings</h2>
      <label class="field">Hide the Claude Code bar after Codex is idle for (minutes)
        <input type="number" id="hide-minutes" min="0" max="1440" step="1" required>
        <span class="hint">0 keeps it up. It comes back the next time a session hands work to Codex.</span>
      </label>
      <label class="field">Archive requests after (days)
        <input type="number" id="archive-days" min="1" max="365" step="1" required>
        <span class="hint">Counted from when the request was sent, once Codex is done and every finding is handled.</span>
      </label>
      <label class="check"><input type="checkbox" id="delete-on"> Delete archived requests from this page</label>
      <label class="field">Delete after this many days in the archive
        <input type="number" id="delete-days" min="1" max="3650" step="1" required>
        <span class="hint">This removes only the request's entry from this page, for good. Nothing else is touched: Codex's own job records, your code, branches and pull requests stay as they are. Deleting happens when you open this page.</span>
      </label>
      <p class="error" id="settings-error" hidden></p>
      <div class="actions">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>
  <div class="list" id="list">
    <div class="empty">Loading requests. A row appears here when a thread sends something to Codex.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STATUS = {
  queued: ['Queued', ''], running: ['Codex working', 'run'], finished: ['Codex finished', 'ok'],
  failed: ['Failed', 'bad'], cancelled: ['Cancelled', ''],
};
const ACTION = { pending: ['Not handled yet', 'run'], fixed: ['Fixed', 'ok'], rejected: ['Not changed', ''], later: ['Left for later', ''] };
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const chip = (text, cls) => `<span class="chip ${cls}">${text}</span>`;

// Archived: older than the archive age, not with Codex and no finding left to handle.
// With deletion on, an archived request's entry is deleted from this page once it has spent the delete age in the archive.
const DAY = 864e5;
const DEFAULTS = { archiveDays: 14, deleteOn: false, deleteDays: 14, autoHideMinutes: 10 };
let settings = { ...DEFAULTS };
const whole = (v, min, max, fallback) => { const n = Math.round(Number(v)); return v !== '' && v != null && n >= min && n <= max ? n : fallback; };
const wholeDays = (v, max, fallback) => whole(v, 1, max, fallback);
const readSettings = d => ({
  archiveDays: wholeDays(d?.archiveDays, 365, DEFAULTS.archiveDays),
  deleteOn: d?.deleteOn === true,
  deleteDays: wholeDays(d?.deleteDays, 3650, DEFAULTS.deleteDays),
  autoHideMinutes: whole(d?.autoHideMinutes, 0, 1440, DEFAULTS.autoHideMinutes),
});
const sentAt = r => Date.parse(r.sentAt || '');
const isArchived = r => {
  const open = (r.findings || []).some(f => (f.state || 'pending') === 'pending');
  return Number.isFinite(sentAt(r)) && Date.now() - sentAt(r) > settings.archiveDays * DAY && r.status !== 'queued' && r.status !== 'running' && !open;
};
const isDue = r => settings.deleteOn && isArchived(r) && Date.now() - sentAt(r) > (settings.archiveDays + settings.deleteDays) * DAY;
let view = 'active';
try { view = localStorage.getItem('codex-band-view') || 'active'; } catch {}
let lastRows = [];
$('views').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  view = b.dataset.view;
  try { localStorage.setItem('codex-band-view', view); } catch {}
  render(lastRows);
});

function render(all) {
  lastRows = all;
  const counts = { active: all.filter(r => !isArchived(r)).length, archived: all.filter(isArchived).length, all: all.length };
  for (const b of $('views').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.view === view));
    b.textContent = `${b.dataset.view[0].toUpperCase()}${b.dataset.view.slice(1)} ${counts[b.dataset.view]}`;
  }
  const rows = view === 'all' ? all.slice() : all.filter(r => (view === 'archived') === isArchived(r));
  rows.sort((a, b) => String(b.sentAt || '').localeCompare(String(a.sentAt || '')));
  const active = all.filter(r => r.status === 'queued' || r.status === 'running').length;
  const open = all.reduce((n, r) => n + (r.findings || []).filter(f => (f.state || 'pending') === 'pending').length, 0);
  const failed = all.filter(r => r.status === 'failed').length;
  $('strip').innerHTML = [
    chip(`<b>${active}</b> with Codex now`, active ? 'run' : ''),
    chip(`<b>${open}</b> findings not handled`, open ? 'run' : 'ok'),
    failed ? chip(`<b>${failed}</b> failed`, 'bad') : '',
    chip(`<b>${all.length}</b> requests in all`, ''),
  ].join('');
  if (!rows.length) {
    $('list').innerHTML = `<div class="empty">${!all.length ? 'No Codex requests yet. A row appears here when a thread sends a review or task to Codex.' : view === 'archived' ? `Nothing archived yet. Requests move here ${settings.archiveDays} days after they were sent, once Codex is done and every finding is handled.` : 'No active requests. Older ones are under Archived.'}</div>`;
    return;
  }
  $('list').innerHTML = rows.map((r, i) => {
    const [st, stc] = STATUS[r.status] || [esc(r.status || 'Unknown'), ''];
    const findings = r.findings || [];
    const pend = findings.filter(f => (f.state || 'pending') === 'pending').length;
    // No findings list at all means the thread hasn't added them yet (codex-band logs the row without them), not that Codex found nothing.
    const fsum = r.status !== 'finished' ? '' : !Array.isArray(r.findings) ? chip('Findings not added yet', 'run') : findings.length ? chip(`${findings.length} finding${findings.length > 1 ? 's' : ''}${pend ? `, ${pend} not handled` : ', all handled'}`, pend ? 'run' : 'ok') : chip('No findings', 'ok');
    const table = findings.length ? `<div><p class="label">Findings and what was done</p><div class="tablewrap"><table>
      <thead><tr><th>Level</th><th>Finding</th><th>What was done</th></tr></thead><tbody>${findings.map(f => {
        const [a, ac] = ACTION[f.state || 'pending'] || [esc(f.state), ''];
        return `<tr><td class="p">${esc(f.priority)}</td><td>${esc(f.title)}</td><td>${chip(a, ac)}${f.action ? `<div>${esc(f.action)}</div>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';
    const links = [r.commentUrl && `<a href="${esc(r.commentUrl)}" target="_blank" rel="noopener">Full Codex output on GitHub</a>`,
      r.pr && (/^https:\/\//.test(r.prUrl || '') ? `<a href="${esc(r.prUrl)}" target="_blank" rel="noopener">PR #${esc(r.pr)}</a>` : `<span>PR #${esc(r.pr)}</span>`)].filter(Boolean).join('');
    return `<details class="req"${i === 0 ? ' open' : ''}><summary>
      <span class="kind">${esc(r.kind || 'review')}</span><span class="ttl">${r.pr ? `#${esc(r.pr)} ` : ''}${esc(r.title || '')}</span><span class="when">${fmt(r.sentAt)}</span>
      <span class="meta">${chip(st, stc)}${fsum}${r.thread ? `<span>from ${esc(r.thread)}</span>` : ''}</span></summary>
      <div class="body">
        ${r.summary ? `<div><p class="label">In short</p><div>${esc(r.summary)}</div></div>` : ''}
        <div><p class="label">Sent to Codex${r.commit ? ` at <code>${esc(String(r.commit).slice(0, 10))}</code>` : ''}</p><pre class="brief">${esc(r.brief || r.command || 'Not recorded')}</pre></div>
        ${table}
        ${links ? `<div class="links">${links}</div>` : ''}
      </div></details>`;
  }).join('');
}

(async () => {
  const db = await claude.use('db');
  if (!db) { $('list').innerHTML = '<div class="empty">Sign in to claude.ai to see Codex requests.</div>'; return; }
  const timer = setTimeout(() => { $('status').hidden = false; $('status').textContent = "Can't reach the request list yet. It will appear when the connection comes back."; }, 10000);
  let rowsReady = false, settingsReady = false, swept = false;
  // Deletes due entries at most once per page load, outside the snapshot callbacks, one at a time.
  const sweep = () => {
    if (swept || !rowsReady || !settingsReady || !settings.deleteOn) return;
    swept = true;
    setTimeout(async () => {
      for (const r of lastRows.filter(isDue)) {
        try { await db.collection('requests').doc(r.id).delete(); } catch { break; } // not the owner, or offline
      }
    }, 0);
  };
  db.doc('settings/page').onSnapshot(snap => {
    settings = readSettings(snap.data());
    if (!snap.metadata?.fromCache) settingsReady = true;
    render(lastRows);
    sweep();
  }, () => { settingsReady = true; });
  const dialog = $('settings');
  const syncDeleteField = () => { $('delete-days').disabled = !$('delete-on').checked; };
  $('cog').addEventListener('click', () => {
    $('hide-minutes').value = settings.autoHideMinutes;
    $('archive-days').value = settings.archiveDays;
    $('delete-on').checked = settings.deleteOn;
    $('delete-days').value = settings.deleteDays;
    $('settings-error').hidden = true;
    syncDeleteField();
    dialog.showModal();
  });
  $('delete-on').addEventListener('change', syncDeleteField);
  $('settings-cancel').addEventListener('click', () => dialog.close());
  $('settings-form').addEventListener('submit', async e => {
    e.preventDefault();
    const next = readSettings({ autoHideMinutes: $('hide-minutes').value, archiveDays: $('archive-days').value, deleteOn: $('delete-on').checked, deleteDays: $('delete-days').value });
    if (JSON.stringify(next) === JSON.stringify(settings)) { dialog.close(); return; }
    try {
      await db.doc('settings/page').set(next);
      dialog.close();
      settings = next;
      swept = false;
      render(lastRows);
      sweep();
    } catch {
      $('settings-error').textContent = "Couldn't save. Only the page's owner can change these settings.";
      $('settings-error').hidden = false;
    }
  });
  db.collection('requests').onSnapshot(snap => {
    if (!snap.metadata?.fromCache) { clearTimeout(timer); $('status').hidden = true; rowsReady = true; }
    render(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    sweep();
  }, err => { clearTimeout(timer); $('status').hidden = false; $('status').textContent = `The request list stopped updating (${err.code}). Reload the page to try again.`; });
})();
</script>

</body></html>
